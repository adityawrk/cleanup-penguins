    <text x="248" y="470" text-anchor="middle" class="sign-word" fill="#e6f4ff" stroke="none">LOCKER</text>
    <rect x="200" y="478" width="96" height="22" rx="6" fill="#fff6e4" stroke-width="2.6"/>
    <text x="248" y="494" text-anchor="middle" class="tag-word" font-size="12" fill="#1a2332" stroke="none">comes back</text>
    <rect x="236" y="410" width="24" height="18" rx="3" fill="#f2c14e" stroke-width="2.6"/>
  </g>

  <!-- THE SEA DOOR: a cargo door open in the hull, with a slide down to the water. It is permanent. -->
  <g class="hot h-sea" data-act="hole" data-hole="sea" stroke="#1a2332" stroke-linejoin="round" stroke-linecap="round">
    <title>The sea. Gone for good.</title>
    <defs><clipPath id="h-door"><path d="M1110 450V286Q1110 250 1146 250H1216Q1252 250 1252 286V450Z"/></clipPath></defs>
    <g clip-path="url(#h-door)" stroke="none">
