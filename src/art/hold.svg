    <rect x="112" y="40" width="12" height="474" rx="4" fill="#9a6236" stroke-width="3.6"/>
    <path d="M70 80h42M70 130h42M70 180h42M70 230h42M70 280h42M70 330h42M70 380h42M70 430h42M70 480h42" stroke="#c48945" stroke-width="9"/>
