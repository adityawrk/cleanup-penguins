    <path d="M30 0H150V44Q90 52 30 44Z" fill="#8fd2f6" stroke-width="4"/>
    <path d="M36 0H144V20Q90 26 36 20Z" fill="#c4ebfb" stroke="none"/>
    <path d="M44 44L22 470H160L136 44Z" fill="#fff6c8" opacity=".28" stroke="none"/>
