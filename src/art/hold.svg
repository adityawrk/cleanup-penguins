    <path d="M1100 456V284Q1100 240 1144 240H1218Q1262 240 1262 284V456" fill="none" stroke="#e24b3f" stroke-width="10" stroke-dasharray="14 14" stroke-linecap="butt"/>
    <path d="M1088 456V284Q1088 228 1144 228H1218Q1274 228 1274 284V456" fill="none" stroke-width="4"/>
    <path d="M1112 456V286Q1112 252 1146 252H1216Q1250 252 1250 286V456" fill="none" stroke-width="4"/>
    <!-- the slide from the floor to the sill -->
    <path d="M1040 540L1112 456H1250L1196 540Z" fill="#c48945" stroke-width="4"/>
    <path d="M1060 530L1118 464H1132L1076 530Z" fill="#e0b56a" stroke="none"/>
    <path d="M1048 530L1112 456M1190 540L1246 458" stroke="#8d5a32" stroke-width="3"/>
    <path d="M1040 540L1112 456H1250L1196 540Z" fill="none" stroke-width="4"/>
