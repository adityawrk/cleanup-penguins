<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" class="map-art" aria-hidden="true">
  <defs>
    <linearGradient id="m-sea" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#4fb0ee"/>
      <stop offset=".55" stop-color="#2f8fdc"/>
      <stop offset="1" stop-color="#1f6fbf"/>
    </linearGradient>
    <radialGradient id="m-glint" cx=".3" cy=".2" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m-snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4eaf8"/>
    </linearGradient>
    <linearGradient id="m-deck" x1=".2" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#f3cf93"/>
      <stop offset=".6" stop-color="#e2ad6a"/>
      <stop offset="1" stop-color="#c58c4b"/>
    </linearGradient>
    <linearGradient id="m-pine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6cc777"/>
      <stop offset=".6" stop-color="#3f9f63"/>
      <stop offset="1" stop-color="#2a7446"/>
    </linearGradient>
    <linearGradient id="m-rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7b5c2"/>
      <stop offset="1" stop-color="#5f6f7e"/>
    </linearGradient>
    <linearGradient id="m-tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#d9d0bf"/>
    </linearGradient>
    <linearGradient id="m-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f36d5e"/>
      <stop offset=".5" stop-color="#da4a3e"/>
      <stop offset="1" stop-color="#a32b22"/>
    </linearGradient>
    <linearGradient id="m-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a9be0"/>
      <stop offset=".5" stop-color="#2f6fb8"/>
      <stop offset="1" stop-color="#1d4f8c"/>
    </linearGradient>
    <linearGradient id="m-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc480"/>
      <stop offset=".5" stop-color="#3f9f63"/>
      <stop offset="1" stop-color="#2a7446"/>
    </linearGradient>
    <linearGradient id="m-sail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#e2d8c2"/>
    </linearGradient>
    <linearGradient id="m-cabin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#d6cab2"/>
    </linearGradient>
    <linearGradient id="m-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5c6d5"/>
      <stop offset=".6" stop-color="#8fa6ba"/>
      <stop offset="1" stop-color="#6d859b"/>
    </linearGradient>
    <linearGradient id="m-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a8aa8"/>
      <stop offset="1" stop-color="#3d5670"/>
    </linearGradient>
    <linearGradient id="m-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f8fd"/>
      <stop offset=".55" stop-color="#bfe8f7"/>
      <stop offset="1" stop-color="#8fcfe8"/>
    </linearGradient>
    <linearGradient id="m-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#e0a420"/>
    </linearGradient>
    <linearGradient id="m-post" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b67b45"/>
      <stop offset="1" stop-color="#7a4a27"/>
    </linearGradient>
    <linearGradient id="m-crate-o" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa95a"/><stop offset="1" stop-color="#d96d1c"/></linearGradient>
    <linearGradient id="m-crate-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd27a"/><stop offset="1" stop-color="#4b9a3c"/></linearGradient>
    <linearGradient id="m-crate-y" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#e0a420"/></linearGradient>
    <radialGradient id="m-dial" cx=".35" cy=".35" r=".75">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#ecdcb8"/>
    </radialGradient>
  </defs>

  <!-- Sea, soft and lit from the upper left -->
  <rect width="640" height="400" rx="22" fill="url(#m-sea)"/>
  <rect width="640" height="400" rx="22" fill="url(#m-glint)"/>
  <g fill="none" stroke="#bfe6ff" stroke-width="2.4" stroke-linecap="round" opacity=".75">
    <path d="M40 60q10-7 20 0t20 0M520 50q10-7 20 0t20 0M70 330q10-7 20 0t20 0M560 340q10-7 20 0t20 0M600 200q8-6 16 0M180 150q8-6 16 0t16 0"/>
  </g>

  <!-- the harbor land: a snowy crescent around a wooden deck -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M40 400C40 300 110 230 200 210C270 196 370 196 440 210C530 230 600 300 600 400Z" fill="url(#m-snow)" stroke="#7fa6c6" stroke-width="2.4"/>
    <path d="M60 336C86 290 130 256 190 236" fill="none" stroke="#fff" stroke-width="5" opacity=".9"/>
    <path d="M70 400C80 330 140 280 210 262C300 244 380 248 450 264C520 282 570 330 580 400Z" fill="url(#m-deck)" stroke="#9a6236" stroke-width="2.2"/>
    <path d="M110 400C120 350 170 316 230 302M520 400C510 350 470 318 410 302M160 400C170 364 210 336 260 324M470 400C460 364 430 340 380 326" fill="none" stroke="#c48945" stroke-width="1.4" opacity=".7"/>
    <!-- deck edge -->
    <path d="M150 300C240 262 400 262 490 300" fill="none" stroke="#8a5a2c" stroke-width="5"/>
    <path d="M152 297C240 260 400 260 488 297" fill="none" stroke="#c48945" stroke-width="1.6"/>
  </g>
  <!-- the boardwalk path between places -->
  <path d="M170 332C220 318 280 326 320 330C360 326 420 318 472 330" fill="none" stroke="#b67a3e" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- snowy pines on the shore -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(70 330) scale(0.9)"><ellipse cx="0" cy="16" rx="18" ry="4" fill="#1a2332" opacity=".13"/><rect x="-4" y="6" width="8" height="10" rx="2" fill="url(#m-post)" stroke="#5a3a20" stroke-width="1.4"/><path d="M0 -40L16 -14H8L22 8H-22L-8 -14H-16Z" fill="url(#m-pine)" stroke="#225f39" stroke-width="2"/><path d="M0 -40L6 -30C2 -28 -3 -28 -6 -30ZM-10 -16c6 2 12 2 18 -2L12 -10C4 -8 -4 -8 -12 -11ZM-14 4c8 3 18 3 28 -2L19 6C6 9 -6 9 -18 6Z" fill="#fff"/></g>
    <g transform="translate(52 372) scale(1.1)"><ellipse cx="0" cy="16" rx="18" ry="4" fill="#1a2332" opacity=".13"/><rect x="-4" y="6" width="8" height="10" rx="2" fill="url(#m-post)" stroke="#5a3a20" stroke-width="1.4"/><path d="M0 -40L16 -14H8L22 8H-22L-8 -14H-16Z" fill="url(#m-pine)" stroke="#225f39" stroke-width="2"/><path d="M0 -40L6 -30C2 -28 -3 -28 -6 -30ZM-10 -16c6 2 12 2 18 -2L12 -10C4 -8 -4 -8 -12 -11ZM-14 4c8 3 18 3 28 -2L19 6C6 9 -6 9 -18 6Z" fill="#fff"/></g>
    <g transform="translate(190 372) scale(0.8)"><ellipse cx="0" cy="16" rx="18" ry="4" fill="#1a2332" opacity=".13"/><rect x="-4" y="6" width="8" height="10" rx="2" fill="url(#m-post)" stroke="#5a3a20" stroke-width="1.4"/><path d="M0 -40L16 -14H8L22 8H-22L-8 -14H-16Z" fill="url(#m-pine)" stroke="#225f39" stroke-width="2"/><path d="M0 -40L6 -30C2 -28 -3 -28 -6 -30ZM-10 -16c6 2 12 2 18 -2L12 -10C4 -8 -4 -8 -12 -11ZM-14 4c8 3 18 3 28 -2L19 6C6 9 -6 9 -18 6Z" fill="#fff"/></g>
    <g transform="translate(452 372) scale(0.8)"><ellipse cx="0" cy="16" rx="18" ry="4" fill="#1a2332" opacity=".13"/><rect x="-4" y="6" width="8" height="10" rx="2" fill="url(#m-post)" stroke="#5a3a20" stroke-width="1.4"/><path d="M0 -40L16 -14H8L22 8H-22L-8 -14H-16Z" fill="url(#m-pine)" stroke="#225f39" stroke-width="2"/><path d="M0 -40L6 -30C2 -28 -3 -28 -6 -30ZM-10 -16c6 2 12 2 18 -2L12 -10C4 -8 -4 -8 -12 -11ZM-14 4c8 3 18 3 28 -2L19 6C6 9 -6 9 -18 6Z" fill="#fff"/></g>
    <g transform="translate(582 322) scale(0.9)"><ellipse cx="0" cy="16" rx="18" ry="4" fill="#1a2332" opacity=".13"/><rect x="-4" y="6" width="8" height="10" rx="2" fill="url(#m-post)" stroke="#5a3a20" stroke-width="1.4"/><path d="M0 -40L16 -14H8L22 8H-22L-8 -14H-16Z" fill="url(#m-pine)" stroke="#225f39" stroke-width="2"/><path d="M0 -40L6 -30C2 -28 -3 -28 -6 -30ZM-10 -16c6 2 12 2 18 -2L12 -10C4 -8 -4 -8 -12 -11ZM-14 4c8 3 18 3 28 -2L19 6C6 9 -6 9 -18 6Z" fill="#fff"/></g>
    <g transform="translate(602 370) scale(1.1)"><ellipse cx="0" cy="16" rx="18" ry="4" fill="#1a2332" opacity=".13"/><rect x="-4" y="6" width="8" height="10" rx="2" fill="url(#m-post)" stroke="#5a3a20" stroke-width="1.4"/><path d="M0 -40L16 -14H8L22 8H-22L-8 -14H-16Z" fill="url(#m-pine)" stroke="#225f39" stroke-width="2"/><path d="M0 -40L6 -30C2 -28 -3 -28 -6 -30ZM-10 -16c6 2 12 2 18 -2L12 -10C4 -8 -4 -8 -12 -11ZM-14 4c8 3 18 3 28 -2L19 6C6 9 -6 9 -18 6Z" fill="#fff"/></g>
  </g>

  <!-- gulls over the water -->
  <path d="M250 110q10-10 20 0q10-10 20 0" fill="none" stroke="#24476e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M410 80q7-7 14 0q7-7 14 0" fill="none" stroke="#24476e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- lighthouse rock -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M490 126q36 8 70 0" fill="none" stroke="#bfe6ff" stroke-width="2.4" opacity=".8"/>
    <path d="M500 112c8-14 36-16 52-2c6 6 4 14-6 16h-40c-8-2-10-8-6-14z" fill="url(#m-rock)" stroke="#4a5866" stroke-width="2"/>
    <path d="M520 112l4-40h12l4 40z" fill="url(#m-tower)" stroke="#8f8370" stroke-width="1.8"/>
    <path d="M522.6 100h14.8l.6 6h-16zM523.8 86h12.4l.5 6h-13.4z" fill="#e24b3f"/>
    <rect x="522" y="66" width="16" height="8" rx="2" fill="#ffe27a" stroke="#b98a14" stroke-width="1.4"/>
    <path d="M516 68l14-12l14 12z" fill="url(#m-red)" stroke="#8a1f17" stroke-width="1.8"/>
    <path d="M525 80v24" stroke="#fff" stroke-width="2" opacity=".7"/>
  </g>
  <!-- iceberg -->
  <path d="M90 150l18-24l12 10l14-18l22 32z" fill="url(#m-snow)" stroke="#7fa6c6" stroke-width="2" stroke-linejoin="round"/>
  <path d="M134 118l8 18l-6 14h20z" fill="#c7e4f6"/>
  <path d="M84 154q36 6 76 0" fill="none" stroke="#bfe6ff" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>

  <!-- PLACES: each is a button with a pin. -->
  <g class="map-place" data-go="locker" stroke-linejoin="round" stroke-linecap="round">
    <title>The Locker</title>
    <ellipse cx="136" cy="324" rx="46" ry="5" fill="#1a2332" opacity=".13"/>
    <rect x="96" y="268" width="80" height="54" rx="3" fill="url(#m-steel)" stroke="#4e6b86" stroke-width="2.2"/>
    <path d="M104 272v46M112 272v46M160 272v46M168 272v46" stroke="#7690a6" stroke-width="1.4"/>
    <path d="M88 272l48-30l48 30z" fill="url(#m-roof)" stroke="#2c3f52" stroke-width="2.2"/>
    <path d="M92 270c14-10 30-20 44-26c14 6 30 16 44 26c-10-4-20-4-26 0c-8-6-26-6-36 0c-8-4-18-4-26 0z" fill="url(#m-snow)" stroke="#8fb1cc" stroke-width="1.4"/>
    <rect x="116" y="290" width="40" height="32" rx="2" fill="#5c7388" stroke="#3d5670" stroke-width="1.8"/>
    <path d="M118 296h36M118 302h36M118 308h36M118 314h36" stroke="#4e6b86" stroke-width="1.2"/>
    <rect x="126" y="298" width="20" height="14" rx="3" fill="url(#m-gold)" stroke="#a8730e" stroke-width="1.6"/>
  </g>
  <g class="map-place" data-go="caches" stroke-linejoin="round" stroke-linecap="round">
    <title>Caches</title>
    <path d="M192 264q34 6 70 0" fill="none" stroke="#c9ecff" stroke-width="2.4"/>
    <path d="M240 232v-28" stroke="#5c3f24" stroke-width="2.4"/><path d="M240 206l14 4l-14 4z" fill="url(#m-gold)" stroke="#a8730e" stroke-width="1.4"/>
    <rect x="204" y="214" width="22" height="20" rx="3" fill="url(#m-cabin)" stroke="#8f7f63" stroke-width="1.6"/>
    <rect x="208" y="218" width="14" height="7" rx="2" fill="#2f5f93"/>
    <path d="M200 212h30l-3-6h-24z" fill="url(#m-blue)" stroke="#163c66" stroke-width="1.4"/>
    <path d="M196 236l60-4q-4 22-16 30h-30q-12-10-14-26z" fill="url(#m-red)" stroke="#6b1812" stroke-width="2"/>
    <path d="M198 240l57-4l-.6 4l-56 4z" fill="#fff6e4" opacity=".9"/>
    <path d="M202 248q24 0 48-3" fill="none" stroke="#fff" stroke-width="2.4" opacity=".4"/>
  </g>
  <g class="map-place" data-go="apps" stroke-linejoin="round" stroke-linecap="round">
    <title>Applications</title>
    <path d="M282 258q40 6 78 0" fill="none" stroke="#c9ecff" stroke-width="2.4"/>
    <rect x="294" y="206" width="18" height="18" rx="1.5" fill="url(#m-crate-o)" stroke="#9a4a12" stroke-width="1.6"/>
    <rect x="312" y="210" width="18" height="14" rx="1.5" fill="url(#m-crate-g)" stroke="#2f6a26" stroke-width="1.6"/>
    <rect x="334" y="200" width="16" height="24" rx="1.5" fill="url(#m-crate-y)" stroke="#a8730e" stroke-width="1.6"/>
    <path d="M286 226l70-2q-4 24-16 32h-38q-14-10-16-30z" fill="url(#m-blue)" stroke="#163c66" stroke-width="2"/>
    <path d="M288 230l67-2l-.6 4l-66 2z" fill="#fff6e4" opacity=".9"/>
    <path d="M294 240q30 0 58-3" fill="none" stroke="#fff" stroke-width="2.4" opacity=".4"/>
  </g>
  <g class="map-place" data-go="stuff" stroke-linejoin="round" stroke-linecap="round">
    <title>Your stuff</title>
    <path d="M382 266q34 6 66 0" fill="none" stroke="#c9ecff" stroke-width="2.4"/>
    <path d="M414 234v-46" stroke="#5c3f24" stroke-width="2.4"/>
    <path d="M418 192q20 18 22 42h-22z" fill="url(#m-sail)" stroke="#9c8b6a" stroke-width="1.6"/>
    <path d="M410 196q-14 16 -18 36h18z" fill="url(#m-sail)" stroke="#9c8b6a" stroke-width="1.6"/>
    <path d="M386 236l58 0q-4 22-14 28h-30q-12-8-14-28z" fill="url(#m-green)" stroke="#1f5a35" stroke-width="2"/>
    <path d="M388 240h55l-.6 4h-54z" fill="#fff6e4" opacity=".9"/>
    <path d="M394 250q22 0 44-2" fill="none" stroke="#fff" stroke-width="2.4" opacity=".4"/>
  </g>
  <g class="map-place" data-go="glasshouse" stroke-linejoin="round" stroke-linecap="round">
    <title>The Glasshouse</title>
    <ellipse cx="504" cy="324" rx="46" ry="5" fill="#1a2332" opacity=".13"/>
    <path d="M464 322v-46l40-32l40 32v46z" fill="url(#m-glass)" stroke="#5f9fbf" stroke-width="2.2"/>
    <path d="M464 276h80M504 244v78M484 260v62M524 260v62" fill="none" stroke="#f4f8fb" stroke-width="3.6"/>
    <path d="M470 300l14-14M472 312l22-22M508 296l12-12" stroke="#fff" stroke-width="2" opacity=".8"/>
    <path d="M464 322v-46l40-32l40 32v46z" fill="none" stroke="#5f9fbf" stroke-width="2.2"/>
    <path d="M470 276c10-14 24-24 34-30c10 6 24 16 34 30c-8-4-16-4-22 0c-6-6-18-6-24 0c-8-4-16-4-22 0z" fill="url(#m-snow)" stroke="#8fb1cc" stroke-width="1.4"/>
    <circle cx="484" cy="304" r="8" fill="url(#m-green)" stroke="#1f5a35" stroke-width="1.6"/>
    <path d="M480 300a5 5 0 0 1 4 -3" stroke="#fff" stroke-width="1.6" opacity=".7"/>
  </g>
  <g class="map-place" data-go="quay" stroke-linejoin="round" stroke-linecap="round">
    <title>The quay</title>
    <ellipse cx="320" cy="337" rx="20" ry="4" fill="#1a2332" opacity=".13"/>
    <rect x="308" y="306" width="24" height="30" rx="2" fill="url(#m-post)" stroke="#5a3a20" stroke-width="1.8"/>
    <rect x="298" y="302" width="44" height="7" rx="3" fill="url(#m-post)" stroke="#5a3a20" stroke-width="1.8"/>
    <path d="M312 324c0-10 3-15 8-15s8 5 8 15l3 3h-22z" fill="url(#m-gold)" stroke="#a8730e" stroke-width="1.6"/>
    <path d="M315 322c0-5 1-8 3-9" stroke="#fff" stroke-width="1.6" opacity=".7"/>
  </g>

  <!-- labels -->
  <g class="map-labels" font-family="Fredoka" font-weight="700" font-size="15" text-anchor="middle" fill="#163c66">
    <g stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">
      <text x="136" y="346">Locker</text>
      <text x="226" y="200">Caches</text>
      <text x="322" y="196">Apps</text>
      <text x="416" y="182">Your stuff</text>
      <text x="504" y="346">Glasshouse</text>
      <text x="320" y="360">Quay</text>
    </g>
  </g>
  <!-- compass -->
  <g transform="translate(588 56)" stroke-linejoin="round">
    <circle r="22" fill="url(#m-dial)" stroke="#9c7a45" stroke-width="2"/>
    <circle r="17" fill="none" stroke="#e0c995" stroke-width="1.2"/>
    <path d="M0 -18l6 18l-6 18l-6-18z" fill="url(#m-red)" stroke="#8a1f17" stroke-width="1.4"/>
    <path d="M0 0l6 0l-6 18l-6-18z" fill="#fff" stroke="#9aa9b8" stroke-width="1.2"/>
    <path d="M-12 -12a17 17 0 0 1 10 -5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <rect x="1.5" y="1.5" width="637" height="397" rx="21" fill="none" stroke="#164a85" stroke-width="3"/>
</svg>
