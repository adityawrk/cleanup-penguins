<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" class="map-art" aria-hidden="true">
  <!-- Sea, with a paper edge -->
  <rect width="640" height="400" rx="22" fill="#2a87d6"/>
  <g fill="none" stroke="#5aa8e8" stroke-width="3" stroke-linecap="round">
    <path d="M40 60q10-7 20 0t20 0M520 50q10-7 20 0t20 0M70 330q10-7 20 0t20 0M560 340q10-7 20 0t20 0M300 360q10-7 20 0t20 0M600 200q8-6 16 0"/>
  </g>
  <!-- the harbor land: a snowy crescent -->
  <g stroke="#1a2332" stroke-linejoin="round" stroke-linecap="round">
    <path d="M40 400C40 300 110 230 200 210C270 196 370 196 440 210C530 230 600 300 600 400Z" fill="#f4faff" stroke-width="5"/>
    <path d="M70 400C80 330 140 280 210 262C300 244 380 248 450 264C520 282 570 330 580 400Z" fill="#e3b071" stroke-width="4"/>
    <path d="M110 400C120 350 170 316 230 302M520 400C510 350 470 318 410 302" fill="none" stroke="#c48945" stroke-width="3"/>
    <path d="M60 330C90 300 130 270 180 250" fill="none" stroke="#d6ecf9" stroke-width="5"/>
    <!-- deck edge -->
    <path d="M150 300C240 262 400 262 490 300" fill="none" stroke="#9a6236" stroke-width="7"/>
  </g>
  <!-- lighthouse rock -->
  <g stroke="#1a2332" stroke-linejoin="round">
    <path d="M500 112c8-14 36-16 52-2c6 6 4 14-6 16h-40c-8-2-10-8-6-14z" fill="#7d8c99" stroke-width="3.4"/>
    <path d="M520 112l4-40h12l4 40z" fill="#f5f1e8" stroke-width="3"/>
    <path d="M522 100h16M523 86h14" stroke="#e24b3f" stroke-width="5"/>
    <path d="M516 74l14-12l14 12z" fill="#e24b3f" stroke-width="3"/>
  </g>
  <!-- iceberg -->
  <path d="M90 150l18-24l12 10l14-18l22 32z" fill="#f4faff" stroke="#1a2332" stroke-width="3" stroke-linejoin="round"/>

  <!-- PLACES: each is a button with a pin. -->
  <g class="map-place" data-go="locker" stroke="#1a2332" stroke-linejoin="round" stroke-linecap="round">
    <title>The Locker</title>
    <rect x="96" y="268" width="80" height="54" fill="#8fa6ba" stroke-width="4"/>
    <path d="M88 272l48-30l48 30z" fill="#4e6b86" stroke-width="4"/>
    <path d="M92 270c14-10 30-20 44-26c14 6 30 16 44 26c-10-4-20-4-26 0c-8-6-26-6-36 0c-8-4-18-4-26 0z" fill="#fff" stroke-width="2.6"/>
    <rect x="116" y="290" width="40" height="32" fill="#5c7388" stroke-width="3"/>
    <rect x="126" y="298" width="20" height="14" rx="3" fill="#f4c534" stroke-width="2.4"/>
  </g>
  <g class="map-place" data-go="caches" stroke="#1a2332" stroke-linejoin="round" stroke-linecap="round">
    <title>Caches</title>
    <path d="M196 236l60-4q-4 22-16 30h-30q-12-10-14-26z" fill="#d9493e" stroke-width="4"/>
    <rect x="204" y="214" width="22" height="20" rx="3" fill="#f4efe6" stroke-width="3"/>
    <path d="M240 232v-28" stroke-width="3.4"/><path d="M240 206l14 4l-14 4z" fill="#ffd23f" stroke-width="2.4"/>
  </g>
  <g class="map-place" data-go="apps" stroke="#1a2332" stroke-linejoin="round" stroke-linecap="round">
    <title>Applications</title>
    <path d="M286 226l70-2q-4 24-16 32h-38q-14-10-16-30z" fill="#2f6fb8" stroke-width="4"/>
    <rect x="294" y="206" width="18" height="18" fill="#f08a2c" stroke-width="3"/>
    <rect x="312" y="210" width="18" height="14" fill="#5bb04b" stroke-width="3"/>
    <rect x="334" y="200" width="16" height="24" fill="#f4c534" stroke-width="3"/>
  </g>
  <g class="map-place" data-go="stuff" stroke="#1a2332" stroke-linejoin="round" stroke-linecap="round">
    <title>Your stuff</title>
    <path d="M386 236l58 0q-4 22-14 28h-30q-12-8-14-28z" fill="#3f9f63" stroke-width="4"/>
    <path d="M414 234v-46" stroke-width="3.4"/>
    <path d="M418 192q20 18 22 42h-22z" fill="#fbf4e2" stroke-width="3"/>
  </g>
  <g class="map-place" data-go="glasshouse" stroke="#1a2332" stroke-linejoin="round" stroke-linecap="round">
    <title>The Glasshouse</title>
    <path d="M464 322v-46l40-32l40 32v46z" fill="#bfe8f7" stroke-width="4"/>
    <path d="M464 276h80M504 244v78M484 260v62M524 260v62" fill="none" stroke="#f4f8fb" stroke-width="5"/>
    <path d="M464 322v-46l40-32l40 32v46z" fill="none" stroke-width="4"/>
    <path d="M470 276c10-14 24-24 34-30c10 6 24 16 34 30c-8-4-16-4-22 0c-6-6-18-6-24 0c-8-4-16-4-22 0z" fill="#fff" stroke-width="2.4"/>
    <circle cx="484" cy="300" r="7" fill="#5fc06d" stroke-width="2.4"/>
  </g>
  <g class="map-place" data-go="quay" stroke="#1a2332" stroke-linejoin="round" stroke-linecap="round">
    <title>The quay</title>
    <path d="M308 336h24v-30h-24z" fill="#9a6236" stroke-width="3"/>
    <path d="M300 306h40" stroke-width="6"/>
    <path d="M312 314c0-8 4-12 8-12s8 4 8 12l3 3h-22z" fill="#f2c14e" stroke-width="2.6"/>
  </g>

  <!-- labels -->
  <g class="map-labels" font-family="Fredoka" font-weight="700" font-size="15" text-anchor="middle" fill="#1a2332">
    <g stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke">
      <text x="136" y="346">Locker</text>
      <text x="226" y="200">Caches</text>
      <text x="322" y="196">Apps</text>
      <text x="416" y="182">Your stuff</text>
      <text x="504" y="346">Glasshouse</text>
      <text x="320" y="360">Quay</text>
    </g>
  </g>
  <!-- compass -->
  <g transform="translate(588 56)" stroke="#1a2332" stroke-linejoin="round">
    <circle r="22" fill="#fff6e4" stroke-width="3"/>
    <path d="M0 -18l6 18l-6 18l-6-18z" fill="#e24b3f" stroke-width="2.4"/>
    <path d="M0 0l6 0l-6 18l-6-18z" fill="#fff" stroke-width="2"/>
  </g>
  <rect width="640" height="400" rx="22" fill="none" stroke="#1a2332" stroke-width="6"/>
</svg>
