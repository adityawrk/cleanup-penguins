<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 708" class="paint-svg" aria-hidden="true">
  <defs>
    <linearGradient id="q-f-iron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8098b2"/><stop offset=".55" stop-color="#55687e"/><stop offset="1" stop-color="#3a4758"/>
    </linearGradient>
    <linearGradient id="q-f-cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ea6bf"/><stop offset=".6" stop-color="#5c6f86"/><stop offset="1" stop-color="#43526a"/>
    </linearGradient>
    <linearGradient id="q-f-snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d4eaf8"/>
    </linearGradient>
    <linearGradient id="q-f-pole" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d82a0"/><stop offset=".5" stop-color="#3d4d63"/><stop offset="1" stop-color="#2a3646"/>
    </linearGradient>
    <linearGradient id="q-f-lamp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffbe0"/><stop offset=".55" stop-color="#ffe27a"/><stop offset="1" stop-color="#f2b938"/>
    </linearGradient>
    <linearGradient id="q-f-drift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#e4f2fb"/><stop offset="1" stop-color="#c7e4f6"/>
    </linearGradient>
  </defs>
  <!-- Foreground: drawn above the penguins so they can walk behind it. Kept to the corners. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <!-- a big iron bollard, bottom left, cut by the frame, with a hawser looped round it -->
    <path d="M-20 712V700Q50 686 150 704V712Z" fill="#1a2332" opacity=".13"/>
    <path d="M6 716V646H96V716Z" fill="url(#q-f-iron)" stroke="#2c3848" stroke-width="2.4"/>
    <path d="M16 654v54" stroke="#fff" stroke-opacity=".3" stroke-width="4"/>
    <path d="M-10 646C-10 630 8 620 51 620C94 620 112 630 112 646C112 656 94 660 51 660C8 660 -10 656 -10 646Z" fill="url(#q-f-cap)" stroke="#2c3848" stroke-width="2.4"/>
    <path d="M-6 640C-4 626 14 616 34 618C42 608 66 608 76 616C92 612 108 622 108 636C96 644 70 646 50 644C26 646 4 646 -6 640Z" fill="url(#q-f-snow)" stroke="#8fb1cc" stroke-width="1.8"/>
    <path d="M14 626c10-6 22-8 32-7" fill="none" stroke="#fff" stroke-width="3"/>
    <!-- hawser: a turn round the post, then off the frame -->
    <path d="M-20 694C10 704 40 702 60 690C80 678 104 676 118 686C130 696 126 712 112 716" fill="none" stroke="#8a6a3a" stroke-width="11"/>
    <path d="M-20 694C10 704 40 702 60 690C80 678 104 676 118 686C130 696 126 712 112 716" fill="none" stroke="#e0c088" stroke-width="8"/>
    <path d="M-16 692C12 700 40 698 58 687" fill="none" stroke="#fff3d6" stroke-opacity=".7" stroke-width="2.4"/>
    <path d="M4 674C24 670 52 670 74 676C86 680 98 676 98 676" fill="none" stroke="#8a6a3a" stroke-width="9.4"/>
    <path d="M4 674C24 670 52 670 74 676C86 680 98 676 98 676" fill="none" stroke="#ebcf98" stroke-width="6.4"/>
    <!-- snow heaped at its foot -->
    <path d="M96 712C98 700 108 694 118 696C124 688 140 688 144 698C150 698 154 706 152 712Z" fill="url(#q-f-snow)" stroke="#8fb1cc" stroke-width="1.8"/>

    <!-- lamp post, front right -->
    <ellipse cx="1224" cy="700" rx="30" ry="5" fill="#1a2332" opacity=".13"/>
    <rect x="1217" y="478" width="10" height="226" rx="3" fill="url(#q-f-pole)" stroke="#1f2a38" stroke-width="1.8"/>
    <path d="M1208 708v-12h28v12" fill="#3d4d63" stroke="#1f2a38" stroke-width="2"/>
    <path d="M1204 480h36l-7-34h-22z" fill="url(#q-f-lamp)" stroke="#a8730e" stroke-width="2"/>
    <path d="M1222 446v34" stroke="#a8730e" stroke-width="1.4"/>
    <path d="M1212 472l4-20" stroke="#fff" stroke-opacity=".8" stroke-width="2.6"/>
    <path d="M1198 448h48l-9-16h-30z" fill="url(#q-f-pole)" stroke="#1f2a38" stroke-width="2"/>
    <path d="M1198 437c6-12 42-12 48 0c-9 5-39 5-48 0z" fill="url(#q-f-snow)" stroke="#8fb1cc" stroke-width="1.6"/>
    <path d="M1222 532c-16 0-26 4-26 10c0 6 10 10 26 10" fill="none" stroke="#8a6a3a" stroke-width="6"/>
    <path d="M1222 532c-16 0-26 4-26 10c0 6 10 10 26 10" fill="none" stroke="#e0c088" stroke-width="3.6"/>
    <!-- snow drift, bottom right -->
    <path d="M1130 712C1134 684 1160 668 1188 674C1204 654 1240 654 1256 672C1274 668 1292 680 1292 712Z" fill="url(#q-f-drift)" stroke="#8fb1cc" stroke-width="2.2"/>
    <path d="M1196 670c8-6 20-8 30-6M1160 688c6-4 12-5 18-4" fill="none" stroke="#fff" stroke-width="3.4"/>
  </g>
</svg>
